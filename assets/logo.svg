<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Studio 47 chrome emblem">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#dfe9f5"/>
      <stop offset="0.4" stop-color="#8fa6bd"/>
      <stop offset="0.52" stop-color="#5a6b7d"/>
      <stop offset="0.6" stop-color="#c7d6e6"/>
      <stop offset="0.78" stop-color="#7c8a99"/>
      <stop offset="1" stop-color="#dbe6f2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#6b7a8b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- one mirrored chrome spark: four long curved concave spikes -->
  <g filter="url(#glow)" stroke="url(#edge)" stroke-width="1.4" stroke-linejoin="round">
    <g fill="url(#chrome)">
      <!-- top spike -->
      <path d="M200 26 C214 120 218 150 240 175 C214 172 205 176 200 200 C195 176 186 172 160 175 C182 150 186 120 200 26 Z"/>
      <!-- bottom spike -->
      <path d="M200 374 C186 280 182 250 160 225 C186 228 195 224 200 200 C205 224 214 228 240 225 C218 250 214 280 200 374 Z"/>
      <!-- left spike -->
      <path d="M26 200 C120 186 150 182 175 160 C172 186 176 195 200 200 C176 205 172 214 175 240 C150 218 120 214 26 200 Z"/>
      <!-- right spike -->
      <path d="M374 200 C280 214 250 218 225 240 C228 214 224 205 200 200 C224 195 228 186 225 160 C250 182 280 186 374 200 Z"/>
    </g>
    <!-- diagonal short spikes for extra bite -->
    <g fill="url(#chrome)" opacity="0.96">
      <path d="M300 100 C246 150 232 164 214 186 C230 168 234 152 238 118 C226 140 210 148 186 158 C210 132 250 118 300 100 Z"/>
      <path d="M100 300 C154 250 168 236 186 214 C170 232 166 248 162 282 C174 260 190 252 214 242 C190 268 150 282 100 300 Z"/>
    </g>
  </g>
  <!-- specular highlight core -->
  <circle cx="188" cy="185" r="7" fill="#ffffff" opacity="0.9"/>
</svg>
